<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Титутатон — отчеканенные песни</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<script>
/* Галерея теперь вид внутри главной (SPA, #view=gallery), поэтому старый
   адрес gallery.html просто перекидывает туда, сохраняя фильтры.
   Идём в «./», а не в index.html: локально корень отдаёт index.html,
   в зеркале — index.html. */
(function(){
  var s = location.search, h = "#view=gallery";
  if(/[?&]mine\b/.test(s)) h += "&mine=1";
  var q = /[?&]q=([^&]*)/.exec(s);
  if(q) h += "&q=" + q[1];
  location.replace("./" + h);
})();
</script>
</head>
<body>
<p>Галерея переехала: <a href="./#view=gallery">открыть отчеканенные песни</a>.</p>
</body>
</html>
